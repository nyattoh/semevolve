name: P0 transport

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  transport:
    name: Transport (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@10.9.4 --ignore-scripts --no-audit --no-fund
      - run: node --version
      - run: npm --version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test --workspace=@semevolve/language-registry
      - run: npm run test:persistence --workspace=@semevolve/language-registry
      - run: npm run test:mechanism --workspace=@semevolve/policy
      - run: npm run test:persistence --workspace=@semevolve/policy
      - run: node node_modules/typescript/bin/tsc -p tests/mechanism/policy/tsconfig.json
      - run: node tests/mechanism/policy/mutations.mjs
      - run: npm run test:local --workspace=@semevolve/transport-adapters
      - run: npm run test:durable --workspace=@semevolve/transport-adapters
      - run: npm run test:contracts
      - run: npm run test:core
      - run: npm run test:persistence
      - run: npm run test:core-consumers
      - run: npm run check:acceptance
      - run: npm run check:public-artifacts
