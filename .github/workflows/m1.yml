name: M1 local capture

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'tests/integration/m0/**'
      - 'tests/integration/m1/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.npmrc'
      - '.github/workflows/**'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  m1:
    name: M1 (ubuntu-latest, Node 24.22.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Build and run M1 tests
        run: |
          node --version
          npm install --global npm@10.9.4 --ignore-scripts --no-audit --no-fund
          npm --version
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node --test --test-reporter=tap tests/integration/m1/*.test.mjs
