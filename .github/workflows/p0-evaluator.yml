name: P0 evaluator and fixed SDK

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evaluator:
    name: E (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.0.0', '24.22.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@10.9.4 --ignore-scripts --no-audit --no-fund
      - run: node --version
      - run: npm --version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test --workspace=@semevolve/evaluator
      - run: npm run test:consumers --workspace=@semevolve/evaluator
      - run: npm run test --workspace=@semevolve/tombo-bridge
      - name: Build licensed fixed SDK in RUNNER_TEMP and run actual sessions
        run: npm run test:sdk --workspace=@semevolve/tombo-bridge
      - run: npm run check:acceptance
      - run: npm run check:public-artifacts
