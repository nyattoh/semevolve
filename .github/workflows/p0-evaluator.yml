name: P0 evaluator and fixed SDK

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evaluator:
    name: E (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.0.0', '24.22.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Bootstrap pinned npm from the selected Node distribution
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync, existsSync, mkdtempSync, realpathSync } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';
          import { spawnSync } from 'node:child_process';
          const node = realpathSync(process.execPath);
          const bundled = process.platform === 'win32'
            ? join(dirname(node), 'node_modules/npm/bin/npm-cli.js')
            : resolve(dirname(node), '../lib/node_modules/npm/bin/npm-cli.js');
          assert.ok(existsSync(bundled), 'Selected Node distribution must contain npm');
          const prefix = mkdtempSync(join(realpathSync(process.env.RUNNER_TEMP), 'semevolve-npm-'));
          const installed = spawnSync(node, [bundled, 'install', '--prefix', prefix, '--global=false', '--no-save', '--package-lock=false', '--ignore-scripts', '--no-audit', '--no-fund', 'npm@10.9.4'], { stdio: 'inherit' });
          assert.equal(installed.error, undefined);
          assert.equal(installed.status, 0);
          const cli = join(prefix, 'node_modules/npm/bin/npm-cli.js');
          const version = spawnSync(node, [cli, '--version'], { encoding: 'utf8' });
          assert.equal(version.status, 0, version.stderr);
          assert.equal(version.stdout.trim(), '10.9.4');
          const bin = join(prefix, 'node_modules/.bin');
          assert.ok(existsSync(join(bin, process.platform === 'win32' ? 'npm.cmd' : 'npm')));
          appendFileSync(process.env.GITHUB_PATH, `${bin}\n`);
          console.log(JSON.stringify({ node: process.version, platform: process.platform, bundled, npm: version.stdout.trim(), bin }));
          NODE
      - run: node --version
      - run: npm --version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test --workspace=@semevolve/evaluator
      - run: npm run test:consumers --workspace=@semevolve/evaluator
      - run: npm run test --workspace=@semevolve/tombo-bridge
      - name: Build licensed fixed SDK in RUNNER_TEMP and run actual sessions
        run: npm run test:sdk --workspace=@semevolve/tombo-bridge
      - run: npm run check:acceptance
      - run: npm run check:public-artifacts
